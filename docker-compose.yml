services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: event_timeline
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d event_timeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  embedding-service:
    build:
      context: ./apps/embedding-service
    ports:
      - "8082:8082"
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_PORT: "8082"
      # 国内下载 Hugging Face 模型可改用镜像（可选）
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - embedding_models:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  pgdata:
  embedding_models:
